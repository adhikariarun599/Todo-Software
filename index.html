<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - To-Do App</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg: #f5f7fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(99, 102, 241, 0.12), transparent 30%),
                radial-gradient(circle at bottom right, rgba(14, 165, 233, 0.10), transparent 30%),
                var(--bg);
            color: var(--text);
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .app-wrapper {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 15px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            color: white;
            font-size: 24px;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.25);
        }

        .brand h1 {
            font-size: 24px;
            font-weight: 800;
            margin: 0;
        }

        .brand p {
            margin: 2px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        .main-card {
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(31, 41, 55, 0.08);
            backdrop-filter: blur(12px);
        }

        .add-task-box {
            background: #f8f9ff;
            border: 1px solid #e8e9ff;
            border-radius: 18px;
            padding: 18px;
        }

        .task-input {
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 13px 15px;
            box-shadow: none !important;
        }

        .task-input:focus {
            border-color: var(--primary);
        }

        .btn-primary-custom {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            color: white;
            border-radius: 12px;
            padding: 12px 20px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .btn-primary-custom:hover {
            transform: translateY(-1px);
            color: white;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.25);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 22px 0;
        }

        .stat-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;
        }

        .stat-label {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 5px;
        }

        .stat-number {
            font-size: 25px;
            font-weight: 800;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: center;
            margin-bottom: 18px;
        }

        .search-box {
            position: relative;
            flex: 1;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
        }

        .search-box input {
            padding-left: 42px;
            border-radius: 12px;
            border: 1px solid var(--border);
            height: 44px;
        }

        .filter-buttons {
            display: flex;
            gap: 6px;
            background: #f3f4f6;
            padding: 4px;
            border-radius: 12px;
        }

        .filter-btn {
            border: none;
            background: transparent;
            padding: 8px 14px;
            border-radius: 9px;
            color: var(--muted);
            font-size: 14px;
            font-weight: 600;
        }

        .filter-btn.active {
            background: white;
            color: var(--primary-dark);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 16px;
            transition: all 0.2s ease;
        }

        .task-item:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(31, 41, 55, 0.07);
        }

        .task-check {
            width: 22px;
            height: 22px;
            border: 2px solid #cbd5e1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .task-check:hover {
            border-color: var(--primary);
        }

        .task-item.completed .task-check {
            background: #22c55e;
            border-color: #22c55e;
            color: white;
        }

        .task-check i {
            font-size: 13px;
            display: none;
        }

        .task-item.completed .task-check i {
            display: block;
        }

        .task-content {
            flex: 1;
            min-width: 0;
        }

        .task-title {
            margin: 0;
            font-size: 15px;
            font-weight: 600;
            word-break: break-word;
        }

        .task-item.completed .task-title {
            color: #9ca3af;
            text-decoration: line-through;
        }

        .task-date {
            color: var(--muted);
            font-size: 12px;
            margin-top: 4px;
        }

        .task-actions {
            display: flex;
            gap: 5px;
        }

        .action-btn {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f4f6;
            color: #6b7280;
            transition: 0.2s;
        }

        .action-btn:hover {
            background: #e5e7eb;
            color: var(--text);
        }

        .action-btn.delete:hover {
            background: #fee2e2;
            color: #dc2626;
        }

        .empty-state {
            text-align: center;
            padding: 55px 20px;
            color: var(--muted);
        }

        .empty-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;
            border-radius: 20px;
            background: #eef2ff;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .empty-state h4 {
            color: var(--text);
            font-weight: 700;
        }

        .progress-wrapper {
            margin-bottom: 22px;
        }

        .progress {
            height: 8px;
            border-radius: 20px;
            background: #e5e7eb;
        }

        .progress-bar {
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            border-radius: 20px;
        }

        .modal-content {
            border: none;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .modal-header {
            border-bottom: 1px solid var(--border);
        }

        .modal-footer {
            border-top: 1px solid var(--border);
        }

        @media (max-width: 768px) {
            .app-wrapper {
                padding: 20px 12px;
            }

            .main-card {
                padding: 18px;
                border-radius: 18px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-buttons {
                justify-content: center;
            }

            .task-item {
                align-items: flex-start;
            }

            .task-actions {
                flex-shrink: 0;
            }
        }
    </style>
</head>

<body>

<div class="app-wrapper">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="brand">
            <div class="brand-icon">
                <i class="bi bi-check2-square"></i>
            </div>

            <div>
                <h1>TaskFlow</h1>
                <p>Organize your day, one task at a time.</p>
            </div>
        </div>

        <button
            class="btn btn-light border rounded-3"
            onclick="clearCompleted()"
            title="Clear completed tasks"
        >
            <i class="bi bi-trash3 me-1"></i>
            Clear Completed
        </button>
    </div>

    <div class="main-card">

        <!-- Add Task -->
        <div class="add-task-box">

            <form id="taskForm">
                <div class="row g-2">

                    <div class="col-md-9">
                        <input
                            type="text"
                            id="taskInput"
                            class="form-control task-input"
                            placeholder="What needs to be done?"
                            autocomplete="off"
                        >
                    </div>

                    <div class="col-md-3 d-grid">
                        <button
                            type="submit"
                            class="btn btn-primary-custom"
                        >
                            <i class="bi bi-plus-lg me-1"></i>
                            Add Task
                        </button>
                    </div>

                </div>
            </form>

        </div>

        <!-- Statistics -->
        <div class="stats">

            <div class="stat-card">
                <div class="stat-label">Total Tasks</div>
                <div class="stat-number" id="totalCount">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Active</div>
                <div class="stat-number text-primary" id="activeCount">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Completed</div>
                <div class="stat-number text-success" id="completedCount">0</div>
            </div>

        </div>

        <!-- Progress -->
        <div class="progress-wrapper">

            <div class="d-flex justify-content-between mb-2">
                <small class="text-muted">Progress</small>
                <small class="fw-semibold" id="progressText">0%</small>
            </div>

            <div class="progress">
                <div
                    id="progressBar"
                    class="progress-bar"
                    role="progressbar"
                    style="width: 0%"
                ></div>
            </div>

        </div>

        <!-- Toolbar -->
        <div class="toolbar">

            <div class="search-box">
                <i class="bi bi-search"></i>

                <input
                    type="text"
                    id="searchInput"
                    class="form-control"
                    placeholder="Search tasks..."
                >
            </div>

            <div class="filter-buttons">

                <button
                    class="filter-btn active"
                    data-filter="all"
                >
                    All
                </button>

                <button
                    class="filter-btn"
                    data-filter="active"
                >
                    Active
                </button>

                <button
                    class="filter-btn"
                    data-filter="completed"
                >
                    Completed
                </button>

            </div>

        </div>

        <!-- Task List -->
        <div id="taskList" class="task-list"></div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state d-none">

            <div class="empty-icon">
                <i class="bi bi-clipboard-check"></i>
            </div>

            <h4>No tasks found</h4>

            <p class="mb-0">
                Add a new task and start being productive.
            </p>

        </div>

    </div>

    <div class="text-center mt-4">
        <small class="text-muted">
            TaskFlow &copy; 2026 · Your tasks are saved locally.
        </small>
    </div>

</div>


<!-- Edit Modal -->
<div
    class="modal fade"
    id="editModal"
    tabindex="-1"
    aria-hidden="true"
>
    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="bi bi-pencil-square me-2"></i>
                    Edit Task
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                ></button>
            </div>

            <div class="modal-body">

                <input
                    type="text"
                    id="editTaskInput"
                    class="form-control task-input"
                    placeholder="Enter task..."
                >

            </div>

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-light"
                    data-bs-dismiss="modal"
                >
                    Cancel
                </button>

                <button
                    type="button"
                    class="btn btn-primary-custom"
                    id="saveEditBtn"
                >
                    Save Changes
                </button>

            </div>

        </div>

    </div>
</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

    // ==========================================
    // APPLICATION STATE
    // ==========================================

    let tasks = JSON.parse(localStorage.getItem("taskflow_tasks")) || [];

    let currentFilter = "all";
    let currentSearch = "";
    let editingTaskId = null;


    // ==========================================
    // DOM ELEMENTS
    // ==========================================

    const taskForm = document.getElementById("taskForm");
    const taskInput = document.getElementById("taskInput");
    const taskList = document.getElementById("taskList");
    const emptyState = document.getElementById("emptyState");

    const searchInput = document.getElementById("searchInput");

    const totalCount = document.getElementById("totalCount");
    const activeCount = document.getElementById("activeCount");
    const completedCount = document.getElementById("completedCount");

    const progressBar = document.getElementById("progressBar");
    const progressText = document.getElementById("progressText");

    const editTaskInput = document.getElementById("editTaskInput");
    const saveEditBtn = document.getElementById("saveEditBtn");

    const editModal = new bootstrap.Modal(
        document.getElementById("editModal")
    );


    // ==========================================
    // SAVE TO LOCAL STORAGE
    // ==========================================

    function saveTasks() {
        localStorage.setItem(
            "taskflow_tasks",
            JSON.stringify(tasks)
        );
    }


    // ==========================================
    // CREATE TASK
    // ==========================================

    taskForm.addEventListener("submit", function (event) {

        event.preventDefault();

        const title = taskInput.value.trim();

        if (!title) {
            taskInput.focus();
            return;
        }

        const newTask = {
            id: Date.now(),
            title: title,
            completed: false,
            createdAt: new Date().toISOString()
        };

        tasks.unshift(newTask);

        saveTasks();

        taskInput.value = "";

        renderTasks();

        taskInput.focus();
    });


    // ==========================================
    // READ / DISPLAY TASKS
    // ==========================================

    function renderTasks() {

        taskList.innerHTML = "";

        let filteredTasks = tasks.filter(task => {

            const matchesSearch =
                task.title
                    .toLowerCase()
                    .includes(currentSearch.toLowerCase());

            if (!matchesSearch) {
                return false;
            }

            if (currentFilter === "active") {
                return !task.completed;
            }

            if (currentFilter === "completed") {
                return task.completed;
            }

            return true;
        });


        if (filteredTasks.length === 0) {
            emptyState.classList.remove("d-none");
        } else {
            emptyState.classList.add("d-none");
        }


        filteredTasks.forEach(task => {

            const taskElement = document.createElement("div");

            taskElement.className =
                `task-item ${task.completed ? "completed" : ""}`;

            taskElement.innerHTML = `

                <div
                    class="task-check"
                    onclick="toggleTask(${task.id})"
                    title="Mark ${task.completed ? "active" : "completed"}"
                >
                    <i class="bi bi-check-lg"></i>
                </div>

                <div class="task-content">

                    <p class="task-title">
                        ${escapeHTML(task.title)}
                    </p>

                    <div class="task-date">
                        <i class="bi bi-clock me-1"></i>
                        ${formatDate(task.createdAt)}
                    </div>

                </div>

                <div class="task-actions">

                    <button
                        class="action-btn"
                        onclick="openEditModal(${task.id})"
                        title="Edit task"
                    >
                        <i class="bi bi-pencil"></i>
                    </button>

                    <button
                        class="action-btn delete"
                        onclick="deleteTask(${task.id})"
                        title="Delete task"
                    >
                        <i class="bi bi-trash3"></i>
                    </button>

                </div>
            `;

            taskList.appendChild(taskElement);
        });


        updateStatistics();
    }


    // ==========================================
    // UPDATE STATISTICS
    // ==========================================

    function updateStatistics() {

        const total = tasks.length;

        const completed =
            tasks.filter(task => task.completed).length;

        const active = total - completed;

        const percentage =
            total === 0
                ? 0
                : Math.round((completed / total) * 100);


        totalCount.textContent = total;
        activeCount.textContent = active;
        completedCount.textContent = completed;

        progressBar.style.width = `${percentage}%`;
        progressText.textContent = `${percentage}%`;
    }


    // ==========================================
    // MARK TASK COMPLETED / ACTIVE
    // ==========================================

    function toggleTask(id) {

        const task = tasks.find(task => task.id === id);

        if (!task) return;

        task.completed = !task.completed;

        saveTasks();

        renderTasks();
    }


    // ==========================================
    // DELETE TASK
    // ==========================================

    function deleteTask(id) {

        const task = tasks.find(task => task.id === id);

        if (!task) return;

        const confirmed = confirm(
            `Delete "${task.title}"?`
        );

        if (!confirmed) return;

        tasks = tasks.filter(task => task.id !== id);

        saveTasks();

        renderTasks();
    }


    // ==========================================
    // OPEN EDIT MODAL
    // ==========================================

    function openEditModal(id) {

        const task = tasks.find(task => task.id === id);

        if (!task) return;

        editingTaskId = id;

        editTaskInput.value = task.title;

        editModal.show();

        setTimeout(() => {
            editTaskInput.focus();
            editTaskInput.select();
        }, 300);
    }


    // ==========================================
    // UPDATE TASK
    // ==========================================

    saveEditBtn.addEventListener("click", function () {

        const newTitle = editTaskInput.value.trim();

        if (!newTitle) {
            editTaskInput.focus();
            return;
        }

        const task = tasks.find(
            task => task.id === editingTaskId
        );

        if (!task) return;

        task.title = newTitle;

        saveTasks();

        renderTasks();

        editModal.hide();

        editingTaskId = null;
    });


    // ==========================================
    // EDIT USING ENTER KEY
    // ==========================================

    editTaskInput.addEventListener("keydown", function (event) {

        if (event.key === "Enter") {
            saveEditBtn.click();
        }
    });


    // ==========================================
    // SEARCH
    // ==========================================

    searchInput.addEventListener("input", function () {

        currentSearch = this.value.trim();

        renderTasks();
    });


    // ==========================================
    // FILTER
    // ==========================================

    document.querySelectorAll(".filter-btn")
        .forEach(button => {

            button.addEventListener("click", function () {

                document
                    .querySelectorAll(".filter-btn")
                    .forEach(btn =>
                        btn.classList.remove("active")
                    );

                this.classList.add("active");

                currentFilter = this.dataset.filter;

                renderTasks();
            });
        });


    // ==========================================
    // CLEAR COMPLETED
    // ==========================================

    function clearCompleted() {

        const completedTasks =
            tasks.filter(task => task.completed);

        if (completedTasks.length === 0) {
            alert("There are no completed tasks to clear.");
            return;
        }

        const confirmed = confirm(
            `Delete ${completedTasks.length} completed task(s)?`
        );

        if (!confirmed) return;

        tasks = tasks.filter(task => !task.completed);

        saveTasks();

        renderTasks();
    }


    // ==========================================
    // DATE FORMATTER
    // ==========================================

    function formatDate(dateString) {

        const date = new Date(dateString);

        return date.toLocaleDateString(
            undefined,
            {
                year: "numeric",
                month: "short",
                day: "numeric"
            }
        );
    }


    // ==========================================
    // SECURITY
    // Prevent HTML injection inside task titles
    // ==========================================

    function escapeHTML(value) {

        const div = document.createElement("div");

        div.textContent = value;

        return div.innerHTML;
    }


    // ==========================================
    // INITIAL RENDER
    // ==========================================

    renderTasks();

</script>

</body>
</html>
